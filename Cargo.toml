[package]
name = "termharness"
version = "0.2.0"
authors = ["ynqa <un.pensiero.vano@gmail.com>"]
edition = "2024"
description = "Test harness for terminal applications"
repository = "https://github.com/ynqa/termharness"
license = "MIT"
readme = "README.md"

[lib]
name = "termharness"
path = "src/lib.rs"

[dependencies]
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
thiserror = "2.0.18"
unicode-width = "0.2.2"

[dev-dependencies]
indoc = "2.0.6"
